name: Verify font sources
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  font:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/verify.py

  note:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: note
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt 'Pillow>=10,<13'
      - run: python tools/build.py
      - run: python tools/verify.py --fonts build/fonts --compare-release --render
      - run: python tools/make-preview.py
      - run: node tools/verify-preview.mjs
